# Draft of the Hermes plugin-catalog entry.
# Destination: NousResearch/hermes-agent → plugin-catalog/roomsmith.yaml (one-file PR).
# Before opening the PR: replace <SHA> with the full 40-character commit of this
# repo that passed CI, `hermes plugins doctor --ci` and `hermes plugins validate`;
# the image/screenshot URLs pin to that same commit. Pin with scripts/pin-catalog.py.
name: roomsmith
title: Roomsmith
repo: https://github.com/devSebb/roomsmith
sha: "<SHA>"
description: "One 3D room that you and Hermes both edit, and it tells you whether things fit. Drag furniture in a live editor inside Hermes Desktop or the dashboard, or tell Hermes what to change: one saved room with undo, and each sees what the other did. Start from a photo or measurements, add products from a link at true size, ask whether they fit, export GLB/JSON. No accounts or keys. Network: only GETs to product links you paste (public addresses only). Photos go to your own Hermes model. Photo sizes are estimates until you give one real measurement."
maintainer: devSebb
tier: community
category: desktop
requires_hermes: ">=0.21.0"
version: "0.1.0"
platforms: [macos, linux]
docs_url: https://github.com/devSebb/roomsmith#readme
image: "https://raw.githubusercontent.com/devSebb/roomsmith/<SHA>/docs/banner.png"
screenshots:
  - "https://raw.githubusercontent.com/devSebb/roomsmith/<SHA>/docs/screenshots/desktop-page.png"
  - "https://raw.githubusercontent.com/devSebb/roomsmith/<SHA>/docs/screenshots/desktop-pane-follow.png"
readme: true
known_issues:
  - "Sizes read from a photo are estimates until you set one real measurement (a wall, the door, or an object)."
  - "iPhone HEIC photos must be exported as JPEG/PNG first."
  - "In Hermes Desktop, the full-page editor appears after an app restart; the side pane is available immediately."
capabilities:
  provides_tools:
    - roomsmith_projects
    - roomsmith_new_room
    - roomsmith_from_photo
    - roomsmith_inspect
    - roomsmith_apply
    - roomsmith_check
    - roomsmith_read_product
    - roomsmith_add_product
    - roomsmith_history
    - roomsmith_export
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
