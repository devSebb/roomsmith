name: roomsmith
version: 0.1.0
description: One 3D room that you and Hermes both edit. Start from a photo or measurements, add real products at true size, check what fits.
author: devSebb
homepage: https://github.com/devSebb/roomsmith
license: MIT
requires_hermes: ">=0.21.0"
provides_tools:
  - roomsmith_projects
  - roomsmith_new_room
  - roomsmith_from_photo
  - roomsmith_inspect
  - roomsmith_apply
  - roomsmith_check
  - roomsmith_read_product
  - roomsmith_add_product
  - roomsmith_history
  - roomsmith_export
provides_hooks:
  - pre_llm_call
provides_middleware: []
requires_env: []
