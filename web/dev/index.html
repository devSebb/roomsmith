<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Studio — dev harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font: 13px system-ui, sans-serif; color: #e6e8eb; background: #1b1d21; --ui-accent: #4f8cff; }
  body.light { color: #1d1f23; background: #f6f7f9; }
  #bar { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 12px; }
  #root { height: calc(100% - 33px); }
</style>
</head>
<body>
<div id="bar"><b>Room Studio dev</b> <span>backend: <code id="base"></code></span> <button onclick="document.body.classList.toggle('light')">toggle theme</button></div>
<div id="root"></div>
<script>document.getElementById('base').textContent = window.__RS_API_BASE__ || '/api/plugins/room-studio'</script>
<script src="./dev.js"></script>
</body>
</html>
